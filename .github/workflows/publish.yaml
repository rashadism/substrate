name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to tag a release as (e.g. 0.4.0). Leave empty to publish a dev build.'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.version || 'dev' }}
  cancel-in-progress: true

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/substrate

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod

    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    # The default docker driver can't build the multi-platform
    # envoy-dataplane image; docker-container can.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in Helm to GHCR
      run: helm registry login ghcr.io --username ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

    - name: Resolve version
      id: vars
      run: |
        TAG="${{ inputs.version }}"
        if [ -z "${TAG}" ]; then
          echo "tag=dev" >> "${GITHUB_OUTPUT}"
          echo "chart_version=0.0.0-dev" >> "${GITHUB_OUTPUT}"
        else
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${TAG}" >> "${GITHUB_OUTPUT}"
        fi

    # ate-setup's root command always builds a Kubernetes client before any
    # subcommand runs, even one like this that never calls the cluster; the
    # client itself is never dialed, so a config naming an unreachable server
    # satisfies it.
    - name: Write a throwaway kubeconfig
      run: |
        cat > /tmp/fake-kubeconfig.yaml <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://127.0.0.1:1
          name: fake
        contexts:
        - context:
            cluster: fake
            user: fake
          name: fake
        current-context: fake
        users:
        - name: fake
          user:
            token: fake
        EOF

    - name: Build and push component images
      run: VERSION=${{ steps.vars.outputs.tag }} go run ./cmd/ate-setup --kubeconfig /tmp/fake-kubeconfig.yaml publish release-images --ko-docker-repo ${{ env.IMAGE_BASE }}

    - name: Build and push the ate-setup image
      run: KO_DOCKER_REPO=${{ env.IMAGE_BASE }}/ate-setup hack/run-tool.sh ko build --bare --tags ${{ steps.vars.outputs.tag }} ./cmd/ate-setup

    - name: Package and push the substrate-postgres chart
      run: |
        helm package charts/substrate-postgres --version ${{ steps.vars.outputs.chart_version }} -d /tmp/charts
        helm push /tmp/charts/substrate-postgres-${{ steps.vars.outputs.chart_version }}.tgz oci://${{ env.IMAGE_BASE }}/charts

    - name: Package and push the substrate chart
      run: |
        helm package charts/substrate --version ${{ steps.vars.outputs.chart_version }} -d /tmp/charts
        helm push /tmp/charts/substrate-${{ steps.vars.outputs.chart_version }}.tgz oci://${{ env.IMAGE_BASE }}/charts
