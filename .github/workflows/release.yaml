name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0-oc1). Used as the image tag and the chart version (leading "v" stripped for the chart).'
        required: true
      chart_only:
        description: 'Skip building images and just (re)package/push the chart under this tag — the images for it must already exist'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      CHART_REPOSITORY: oci://ghcr.io/${{ github.repository }}/helm
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install ko
        uses: ko-build/setup-ko@v0.7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: ${{ !inputs.chart_only }}
        run: |
          set -o errexit -o nounset -o pipefail

          for component in ateapi atecontroller atelet ateom-gvisor ateom-microvm podcertcontroller atenet ate-setup credential-provider/kubernetes-secrets; do
            # ${component##*/}: credential-provider/kubernetes-secrets -> kubernetes-secrets
            KO_DOCKER_REPO="${IMAGE_REPOSITORY}/${component##*/}" \
            ./hack/run-tool.sh ko build \
              --tags "${TAG}" \
              --platform linux/amd64,linux/arm64 \
              --bare \
              "./cmd/${component}"
          done

      - name: Build and push demo images
        if: ${{ !inputs.chart_only }}
        # Not part of the distribution — a public, pre-built image so
        # anyone trying the chart can smoke-test it without building
        # anything themselves, same app the upstream Quickstart deploys.
        run: |
          set -o errexit -o nounset -o pipefail

          for demo in counter; do
            KO_DOCKER_REPO="${IMAGE_REPOSITORY}/demo-${demo}" \
            ./hack/run-tool.sh ko build \
              --tags "${TAG}" \
              --platform linux/amd64,linux/arm64 \
              --bare \
              "./demos/${demo}"
          done

      - name: Build and push the Envoy dataplane image
        if: ${{ !inputs.chart_only }}
        # Not a cmd/ Go binary: a Rust dynamic module (envoy-substrate-egress-policy)
        # packaged onto envoyproxy/envoy, built with docker buildx per
        # cmd/dataplane/envoy/README.md. atenet-egress needs it.
        run: |
          set -o errexit -o nounset -o pipefail

          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_REPOSITORY}/envoy-dataplane:${TAG}" \
            cmd/dataplane/envoy

      - name: Package and push the Helm chart
        run: |
          set -o errexit -o nounset -o pipefail

          # helm package requires strict SemVer 2 with no leading "v".
          chart_version="${TAG#v}"
          package_dir="${RUNNER_TEMP}/helm-packages"
          mkdir -p "${package_dir}"

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

          helm package charts/substrate \
            --destination "${package_dir}" \
            --version "${chart_version}" \
            --app-version "${TAG}"

          helm push "${package_dir}/substrate-${chart_version}.tgz" "${CHART_REPOSITORY}"
