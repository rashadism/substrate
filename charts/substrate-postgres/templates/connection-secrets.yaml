apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.connectionSecrets.readWrite }}
  namespace: ate-system
type: Opaque
stringData:
  connectionString: "postgresql://{{ .Values.postgres.readWriteUser }}@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/{{ .Values.postgres.readWriteUser }}.pem&sslkey=/run/postgres.podcert.ate.dev/{{ .Values.postgres.readWriteUser }}.pem"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.connectionSecrets.owner }}
  namespace: ate-system
type: Opaque
stringData:
  connectionString: "postgresql://{{ .Values.postgres.ownerUser }}@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/{{ .Values.postgres.ownerUser }}.pem&sslkey=/run/postgres.podcert.ate.dev/{{ .Values.postgres.ownerUser }}.pem"
