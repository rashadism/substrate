apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_key_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_ca_file = '/run/postgres.podcert.ate.dev/trust-bundle.pem'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    local all all trust
    hostssl all postgres all reject
    hostssl atepg substrate_owner_user,substrate_readwrite_user all cert
  reload-tls.sh: |
    set -eu
    trap 'exit 0' TERM INT

    CERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    CA=/run/postgres.podcert.ate.dev/trust-bundle.pem
    INTERVAL=60

    reloaded=""
    while true; do
      current="$(sha256sum "${CERT}" "${CA}" /etc/postgresql/pg_hba.conf)"
      if [ "${current}" != "${reloaded}" ] \
        && psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then
        reloaded="${current}"
        echo "$(date -u +%FT%TZ) reloaded TLS configuration"
      fi
      sleep "${INTERVAL}" &
      wait $!
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: tls-reloader
        restartPolicy: Always
        image: {{ .Values.image }}
        securityContext:
          runAsUser: 70
        env:
        - name: POSTGRES_USER
          value: postgres
        command:
        - /bin/sh
        - /etc/postgresql/reload-tls.sh
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - name: postgres
        image: {{ .Values.image }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -ec
              - |
                until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                    sleep 1
                done
                if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                  "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                  createdb -U "${POSTGRES_USER}" atepg
                fi
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - nc -z 127.0.0.1 5432
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U "${POSTGRES_USER}" -d postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: servicedns
        projected:
          defaultMode: 0600
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: socket
        emptyDir: {}
      - name: postgres-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: postgres.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.storage }}
