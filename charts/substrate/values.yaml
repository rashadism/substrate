# Set to false on a cluster where something else (Flux, Argo, a cluster
# admin) owns ate-system's and podcertificate-controller-system's
# lifecycle - a chart that creates namespaces unconditionally is
# drift-detection noise under GitOps. Off assumes both namespaces already
# exist or you're installing with `--create-namespace`.
createNamespace: true

# Every component shares this OTLP endpoint via envFrom. Logs/metrics are
# out of scope for this chart, so it only needs to exist.
otel:
  endpoint: "http://localhost:4317"

# No pre-built image is published for any component here - build from source.
#
# Every component below also takes a `resources` (and, for the two components
# with a second container, an extra `*Resources`) field: plain
# requests/limits, defaulted conservatively and requests-only where nothing
# here already ran with hard limits in practice. Override per environment;
# none of these numbers are load-tested, just non-zero.
ateSetup:
  image: ""
  # The one-shot identity/CA bootstrap Job.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

podCertificateController:
  image: ""
  workersPerSigner: "1"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

atelet:
  image: ""
  snapshotPluginImage: ""
  # GKE's kubelet credential-provider paths; other node distributions differ.
  imageCredentialProviderBinDir: "/home/kubernetes/bin"
  imageCredentialProviderConfig: "/etc/srv/kubernetes/cri_auth_config.yaml"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  snapshotPluginResources:
    requests:
      cpu: 50m
      memory: 128Mi
  # Extra atelet CLI args/env vars for an installer-specific knob this chart
  # doesn't expose yet, without forking it. extraArgs items are plain
  # strings ("--flag=value"); extraEnv items are ordinary EnvVar objects.
  extraArgs: []
  extraEnv: []

ateController:
  image: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

ateApiServer:
  image: ""
  snapshotPluginImage: ""
  replicas: 2
  # Issuer in actor JWTs' iss claim; must be HTTPS with no query/fragment.
  # Defaults to this chart's own api Service, which publishes the discovery
  # document relying parties fetch.
  actorJWTIssuer: "https://api.ate-system.svc"
  authorization:
    # Principal IDs that are always global AuthZ owners, independent of the
    # stored AccessPolicy - ate-api-server's --authz-bootstrap-owners.
    # ate-api-server refuses to start without at least one of these set;
    # there is no safe default to ship, so this chart's default (empty)
    # will not come up until you set it. A principal ID here is whatever
    # authn produced for it - a Kubernetes ServiceAccount's bound-token
    # subject, an OIDC subject, or a SPIFFE ID for an mTLS caller.
    bootstrapOwners: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  snapshotPluginResources:
    requests:
      cpu: 20m
      memory: 64Mi
  # Same escape hatch as atelet's, for ate-api-server's own CLI/env.
  extraArgs: []
  extraEnv: []

atenetRouter:
  image: ""
  envoyImage: "envoyproxy/envoy:v1.39-latest@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4"
  # SPIFFE IDs (exact match) allowed to connect to actors through the
  # ingress dataplane - atenet-router's --ingress-allowed-spiffe-ids.
  # Empty is the router's own default, and its own default is to serve no
  # ingress traffic at all - there's no unsafe default to accidentally
  # ship here, only an inert one until you list your actual callers.
  ingressAllowedSPIFFEIDs: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  envoyResources:
    requests:
      cpu: 100m
      memory: 256Mi

atenetEgress:
  image: ""
  # Upstream substitutes this outside kustomize (${ENVOY_DATAPLANE_IMAGE}), so
  # there's no natural default; defaults here to the router's Envoy build.
  envoyImage: "envoyproxy/envoy:v1.39-latest@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4"
  # sdsmint is a native sidecar minting short-lived MITM leaf certs; a memory
  # limit with no CPU limit matches how it already ran before this was made
  # configurable.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 768Mi
  envoyResources:
    requests:
      cpu: 200m
      memory: 512Mi
  # The co-located ext_proc server (the atenet binary itself, --mode=egress).
  extProcResources:
    requests:
      cpu: 50m
      memory: 128Mi

# GKE-only (monitoring.googleapis.com/v1 PodMonitoring); off by default to
# keep the chart cloud-neutral.
gcpManagedPrometheus:
  enabled: false

rustfs:
  # Set to false to run every snapshot-capable component against your own
  # S3-compatible bucket instead - rustfs.yaml's Deployment, PVC, bucket-init
  # Job and generated credentials Secret are all skipped, and
  # snapshotStorage.* below becomes required. Snapshots are the one thing
  # this chart cannot run without somewhere to put them; the bundled rustfs
  # is a default, not a requirement.
  enabled: true
  image: "rustfs/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358"
  bucketInitImage: "amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73"
  bucket: ate-snapshots
  storage: 1Gi
  # Left unset: the chart generates and persists a random pair in a Secret on
  # first install. Set both to pin specific values.
  accessKey: ""
  secretKey: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # The one-shot `aws s3 mb` Job that creates the snapshot bucket.
  bucketInitResources:
    requests:
      cpu: 10m
      memory: 32Mi

# Consulted only when rustfs.enabled is false. Every field is required in
# that case - there's no sane default for somebody else's bucket.
snapshotStorage:
  endpointURL: ""
  region: "us-east-1"
  usePathStyle: true
  credentialsSecretRef:
    name: ""
    accessKeyKey: "access-key"
    secretKeyKey: "secret-key"

# Connection strings come from Secrets rendered by the substrate-postgres
# chart (or your own, for an externally managed database). schema/ownerRole/
# readWriteRole must match that chart's own postgres.* values.
postgres:
  readWriteConnectionStringSecretRef:
    name: substrate-postgres-readwrite
  ownerConnectionStringSecretRef:
    name: substrate-postgres-owner
  schema: substrate
  ownerRole: substrate_owner
  readWriteRole: substrate_readwrite

sandboxConfig:
  gvisor:
    defaultVersion: v1
    versions:
    - name: v1
      state: Enabled
      # On GCP, prefer gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da
      pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
      assets:
        amd64:
          gvisor:
            url: "gs://gvisor/releases/nightly/2026-09-02/x86_64/gvisor.tar.zstd"
            sha256: "d547d81401461fd1c679c5c4fa0a6c2b8ef7dc3c22ce23c9e25dcc4c69cfd06f"
        arm64:
          gvisor:
            url: "gs://gvisor/releases/nightly/2026-09-02/aarch64/gvisor.tar.zstd"
            sha256: "a64916f9813ce7e4841a30480a599337f7dda07b421c6bf0123db2212aa7d1df"
