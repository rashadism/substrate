{{- if .Values.gcpManagedPrometheus.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: atenet-router-envoy
  namespace: ate-system
  labels:
    app: atenet-router
spec:
  selector:
    matchLabels:
      app: atenet-router
  endpoints:
  - port: envoy-metrics
    path: /stats/prometheus
    interval: 30s
{{- end }}
