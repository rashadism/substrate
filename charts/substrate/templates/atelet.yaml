apiVersion: v1
kind: ServiceAccount
metadata:
  name: atelet
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atelet
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["csidriverconfigs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ate.dev"]
  resources: ["sandboxconfigs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atelet
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: atelet
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atelet-endpointslices
  namespace: ate-system
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atelet-endpointslices
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: atelet
  namespace: ate-system
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ate-node-critical
value: 1000000000
globalDefault: false
description: "Node-local ate components that every actor activation depends on."
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet
  namespace: ate-system
  labels:
    app: atelet
spec:
  selector:
    matchLabels:
      app: atelet
  template:
    metadata:
      labels:
        app: atelet
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: atelet
      priorityClassName: ate-node-critical
      nodeSelector:
        ate.dev/substrate-version: {{ .Values.substrateVersion | default .Values.image.tag | quote }}
      terminationGracePeriodSeconds: 330
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: atelet
        image: {{ .Values.image.registry }}/atelet:{{ .Values.image.tag }}
        args:
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --drain-delay=0s
        - --drain-timeout=5m
        {{- if .Values.atelet.gcpAuthForImagePulls }}
        - --gcp-auth-for-image-pulls=true
        {{- end }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://rustfs.ate-system.svc:9000
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.rustfs.secretKey | quote }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: grpc
          containerPort: 8085
          hostPort: 8085
        - name: prometheus
          containerPort: 9090
          hostPort: 9090
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: run-ateom
          mountPath: /var/lib/ateom-gvisor
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
      volumes:
      - name: run-ateom
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
