apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["ate.dev"]
  resources: ["workerpools", "sandboxconfigs", "csidriverconfigs"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "watch", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server
subjects:
- kind: ServiceAccount
  name: ate-api-server
  namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-api-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: {{ .Values.ateApiServer.replicas }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ate-api-server
  template:
    metadata:
      labels:
        app: ate-api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      # The snapshot plugin, not ate-api-server, holds the object-store
      # settings; ate-api-server exits if ATE_STORAGE_BACKEND is set on it.
      initContainers:
      - name: snapshot-plugin
        image: {{ .Values.ateApiServer.snapshotPluginImage }}
        restartPolicy: Always
        args:
        - control
        - --socket=/run/snapshot-plugin/control.sock
        startupProbe:
          exec:
            command:
            - /ko-app/snapshot-plugin
            - healthcheck
            - --socket=/run/snapshot-plugin/control.sock
          periodSeconds: 2
          failureThreshold: 30
        securityContext:
          capabilities:
            drop:
            - ALL
        env:
        - name: ATE_STORAGE_BACKEND
          value: "s3"
        - name: AWS_ENDPOINT_URL
          value: "http://rustfs.ate-system.svc:9000"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: secret-key
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: snapshot-plugin
          mountPath: /run/snapshot-plugin
      containers:
      - name: ate-api-server
        image: {{ .Values.ateApiServer.image }}
        args:
          - "--grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
          - --authentication-config=/etc/ateapi/authentication/authentication.yaml
          - --postgres-read-write-connection-string=@env
          - --postgres-owner-connection-string=@env
          - --postgres-read-write-role=@env
          - --postgres-owner-role=@env
          - --postgres-schema=@env
          - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
          - --actor-jwt-issuer=@env
          - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
          - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
          - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
          - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
          - --drain-delay=13s
          - --drain-timeout=15s
          - --snapshot-plugin-socket=/run/snapshot-plugin/control.sock
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: ATE_API_POSTGRES_OWNER_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.ownerConnectionStringSecretRef.name }}
              key: connectionString
        - name: ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.readWriteConnectionStringSecretRef.name }}
              key: connectionString
        - name: ATE_API_POSTGRES_OWNER_ROLE
          value: {{ .Values.postgres.ownerRole | quote }}
        - name: ATE_API_POSTGRES_READ_WRITE_ROLE
          value: {{ .Values.postgres.readWriteRole | quote }}
        - name: ATE_API_POSTGRES_SCHEMA
          value: {{ .Values.postgres.schema | quote }}
        - name: ATE_API_ACTOR_JWT_ISSUER
          value: {{ .Values.ateApiServer.actorJWTIssuer | quote }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: snapshot-plugin
          mountPath: /run/snapshot-plugin
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
        - name: "podidentity"
          mountPath: "/run/podidentity.podcert.ate.dev"
        - name: "postgres"
          mountPath: "/run/postgres.podcert.ate.dev"
          readOnly: true
        - name: "actor-id-jwt-pool"
          mountPath: "/run/actor-id-jwt-pool"
        - name: "actor-id-ca-pool"
          mountPath: "/run/actor-id-ca-pool"
          readOnly: true
        - name: "authentication-config"
          mountPath: "/etc/ateapi/authentication"
          readOnly: true
        ports:
        - containerPort: 443
        - name: prometheus
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: snapshot-plugin
        emptyDir: {}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "podidentity"
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: "postgres"
        projected:
          sources:
          - podCertificate:
              signerName: postgres.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: substrate_owner_user.pem
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_owner_user
          - podCertificate:
              signerName: postgres.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: substrate_readwrite_user.pem
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_readwrite_user
      - name: "actor-id-jwt-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-jwt-pool"
              items:
              - key: "pool"
                path: "pool.json"
      - name: "actor-id-ca-pool"
        projected:
          sources:
          - secret:
              name: "actor-id-ca-pool"
              items:
              - key: "pool"
                path: "pool.json"
      - name: "authentication-config"
        configMap:
          name: "ate-api-authentication"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ate-api-server
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  selector:
    app: ate-api-server
  ports:
  - name: grpc
    protocol: TCP
    port: 443
    targetPort: 443
